# ===========================================================================
# Levi meni KvizRadija.
#
# Tvoja kopija stoji u %APPDATA%\KvizRadio (Windows) odnosno
# ~/.config/KvizRadio (Linux) i menja se bez rekompajliranja - Radio Browser
# tagovi su neuredni ("folk", "narodna", "turbo folk"...), pa se ovde dodaje
# sto fali kad primetis da neka kategorija vuce pogresne stanice.
#
# stavka.X.tagovi je lista ILI: svaki tag je zasebna pretraga, rezultati se
# spoje i poredjaju po broju klikova. Bez tagova ide sve iz te drzave.
# ===========================================================================

grupe=domace,zanrovi

# --- Domace ---------------------------------------------------------------
grupa.domace.naziv=Domace
grupa.domace.stavke=sve,pop,rock,folk,exyu

stavka.sve.naziv=Sve domace
stavka.sve.drzava=RS

stavka.pop.naziv=Pop / Zabavna
stavka.pop.drzava=RS
stavka.pop.tagovi=pop,zabavna,domaca

stavka.rock.naziv=Rock
stavka.rock.drzava=RS
stavka.rock.tagovi=rock,rok

stavka.folk.naziv=Folk / Narodna
stavka.folk.drzava=RS
stavka.folk.tagovi=folk,narodna,turbo folk,izvorna

stavka.exyu.naziv=Ex-Yu
stavka.exyu.tagovi=ex-yu,exyu,ex yu,yugoslavia

# --- Zanrovi --------------------------------------------------------------
grupa.zanrovi.naziv=Zanrovi
grupa.zanrovi.stavke=zrock,zpop,z80,z90,zjazz,zdance,zchill,zclassical

stavka.zrock.naziv=Rock
stavka.zrock.tagovi=rock

stavka.zpop.naziv=Pop
stavka.zpop.tagovi=pop

stavka.z80.naziv=80s
stavka.z80.tagovi=80s,eighties

stavka.z90.naziv=90s
stavka.z90.tagovi=90s,nineties

stavka.zjazz.naziv=Jazz
stavka.zjazz.tagovi=jazz

stavka.zdance.naziv=Dance
stavka.zdance.tagovi=dance,electronic,house

stavka.zchill.naziv=Chill / Lounge
stavka.zchill.tagovi=chillout,lounge,ambient

stavka.zclassical.naziv=Klasika
stavka.zclassical.tagovi=classical

# Koliko stanica po sekciji trazimo od API-ja.
limit=40

# --- Prepoznavanje pesme ---------------------------------------------------
# Naziv pesme se prvo cita sa samog strima (ICY). Dosta stanica ga ne salje -
# mereno, sedam od trinaest ga salje - pa za ostale postoji dugme PREPOZNAJ.
#
# servis=shazam    preko biblioteke shazamio, kroz zaseban Python proces.
#                  Besplatno i najtacnije od probanog, ali koristi Shazamov
#                  NEZVANICNI API - to krsi njihove uslove i puca kad promene
#                  protokol. Za licnu upotrebu, ne za deljenje dalje.
#                  Treba: Python 3 + shazamio + ffmpeg
#                    python3 -m venv venv && venv/bin/pip install shazamio
#                  pa ispod prepoznavanje.python=putanja/do/venv/bin/python
#                  (ffmpeg se uzima sa PATH-a, ili ako stoji uz aplikaciju)
# servis=audd      radjeno za radio: posalje mu se URL strima i on sam oslusne.
#                  Kljuc: https://audd.io (placa se posle probnog perioda)
# servis=acoustid  besplatno, ali NE RADI za radio - provereno: na SomaFM strimu
#                  gde ICY kaze "Electric Skychurch - Heaven", AcoustID vraca
#                  prazan rezultat i za 20s i za 60s otiska. Indeksira otiske
#                  celih snimaka i poredi po trajanju, pa isecak nema sta da
#                  pogodi. Ostavljeno kao opcija, ne kao preporuka.
#
# PAZI: kljuc NE ide ovde - ovaj fajl je u gitu, a repo je javan. Ide u tvoju
# kopiju (~/.config/KvizRadio/kvizradio.properties, odnosno %APPDATA%\KvizRadio),
# koja se pravi pri prvom pokretanju i pregazi ove vrednosti.
# Bez kljuca dugme objasni gde se uzima, umesto da tiho ne radi.
prepoznavanje.servis=audd
prepoznavanje.apiKey=
# samo za servis=shazam; prazno znaci python3 (Linux) odnosno python (Windows)
prepoznavanje.python=
