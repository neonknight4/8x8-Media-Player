name: Windows installer

on:
  workflow_dispatch:
    inputs:
      verzija:
        description: 'Verzija (npr. 1.1). Mora biti VECA od instalirane da bi update prosao.'
        required: true
        default: '1.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    # Za pravljenje release-a; instaler ide kao release asset, ne kao artifact.
    permissions:
      contents: write

    env:
      # VLC 3.x, ne 4.x - vlcj 4 radi sa libvlc 3. Pinovano namerno, da novo
      # izdanje VideoLAN-a ne promeni instaler samo od sebe.
      VLC_VERSION: 3.0.23
      # Python 3.12 embeddable + shazamio: instaler nosi svoj Python, kao i VLC.
      # 3.12, ne 3.13 - numpy i aiohttp imaju gotove cp312 wheel-ove za
      # win_amd64, pa pip nista ne kompajlira u CI-ju.
      PYTHON_VERSION: 3.12.10
      # ffmpeg snima isecak strima za shazamio
      FFMPEG_VERSION: 7.1.1

    steps:
      - uses: actions/checkout@v7

      # Verzija iz taga (v1.2 -> 1.2) ili iz rucnog pokretanja.
      # Windows instaler poredi verzije: nova mora biti veca, inace odbije update.
      - name: Odredi verziju
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $v = "${{ github.event.inputs.verzija }}"
          }
          if ($v -notmatch '^\d+(\.\d+){0,2}$') {
            Write-Error "Verzija '$v' nije u obliku 1 / 1.2 / 1.2.3"
            exit 1
          }
          echo "verzija=$v" >> $env:GITHUB_OUTPUT
          echo "Verzija: $v"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install WiX Toolset 3
        run: |
          choco install wixtoolset -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Maven build
        run: mvn -B clean package

      # Instalacija nosi svoj libvlc, kao sto HUB nosi yt-dlp i ffmpeg: na tudjem
      # laptopu u kafani se ne racuna na to da je VLC instaliran. plugins\ mora
      # da stoji pored dll-a - libvlc ih trazi relativno u odnosu na sebe.
      - name: Download VLC (libvlc + plugins)
        shell: pwsh
        run: |
          $zip = "vlc-$env:VLC_VERSION-win64.zip"
          Invoke-WebRequest -Uri "https://get.videolan.org/vlc/$env:VLC_VERSION/win64/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath vlc-tmp
          New-Item -ItemType Directory -Force -Path tools\vlc | Out-Null
          $src = "vlc-tmp\vlc-$env:VLC_VERSION"
          Copy-Item "$src\libvlc.dll" tools\vlc\
          Copy-Item "$src\libvlccore.dll" tools\vlc\
          Copy-Item "$src\plugins" tools\vlc\ -Recurse
          "libvlc: $((Get-Item tools\vlc\libvlc.dll).Length) bajtova, plugina: $((Get-ChildItem tools\vlc\plugins -Recurse -File).Count)"

      # Embeddable Python nema pip niti gleda site-packages dok se u ._pth fajlu
      # ne odkomentarise "import site" - bez toga "import shazamio" puca iako je
      # paket na disku.
      - name: Bundle Python + shazamio
        shell: pwsh
        run: |
          $zip = "python-$env:PYTHON_VERSION-embed-amd64.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$env:PYTHON_VERSION/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath tools\python
          Get-ChildItem tools\python\python*._pth | ForEach-Object {
            (Get-Content $_) -replace '^#\s*import site', 'import site' | Set-Content $_
          }
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          tools\python\python.exe get-pip.py --no-warn-script-location
          tools\python\python.exe -m pip install --no-warn-script-location --only-binary=:all: shazamio
          # provera da paket zaista moze da se ucita iz embeddable Pythona
          tools\python\python.exe -c "import shazamio"
          "python + shazamio: $([math]::Round((Get-ChildItem tools\python -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)) MB"

      # Skripta zove ffmpeg da snimi isecak strima; Alati.alat("ffmpeg") ga
      # nalazi pored .exe-a. Iz zipa ide samo ffmpeg.exe - ffplay i ffprobe ne.
      - name: Download ffmpeg
        shell: pwsh
        run: |
          $zip = "ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath ffmpeg-tmp
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName tools\
          "ffmpeg: $((Get-Item tools\ffmpeg.exe).Length) bajtova"

      # --win-upgrade-uuid mora ostati ISTI zauvek - po njemu Windows prepoznaje
      # da je ovo ista aplikacija i radi update umesto druge instalacije.
      #
      # Aplikacija se pakuje preko classpath-a, ne kao modul: jaudiotagger nema
      # module-info, a jlink odbija automatske module. Zato --main-jar/--main-class,
      # i zato Pokretac ne nasledjuje Application.
      #
      # --add-modules jdk.crypto.ec: SunEC nije nicija "requires" nego service
      # provider, pa ga jlink ne uvlaci sam. Bez njega runtime nema nijedan
      # ECDHE cipher suite i HTTPS ka api.radio-browser.info pukne na
      # handshake_failure.
      #
      # --add-modules jdk.unsupported: JavaFX-ov Marlin rasterizer trazi
      # sun.misc.Unsafe. Bez njega se aplikacija digne pa pukne na prvom
      # crtanju - NoClassDefFoundError: sun/misc/Unsafe u com.sun.marlin.
      - name: jpackage
        shell: pwsh
        run: |
          # ime jar-a je uvek KvizRadio-1.0.jar (verzija u pom-u), a --main-jar
          # trazi tacno ime - pa se prepisuje na stalno
          Copy-Item (Get-ChildItem target\KvizRadio-*.jar | Select-Object -First 1).FullName target\libs\KvizRadio.jar
          # sve iz tools ide u isti --input folder: VLC, Python, ffmpeg i skripte pored .exe-a
          Copy-Item tools\* target\libs\ -Recurse -Force
          jpackage `
            --type exe `
            --name KvizRadio `
            --app-version ${{ steps.v.outputs.verzija }} `
            --win-upgrade-uuid d0cee49b-4869-4ae4-8c95-0778d93cec2b `
            --icon installer\kvizradio.ico `
            --input target\libs `
            --main-jar KvizRadio.jar `
            --main-class its.kvizradio.Pokretac `
            --add-modules java.base,java.desktop,java.net.http,java.logging,jdk.crypto.ec,jdk.unsupported `
            --dest dist `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --win-shortcut-prompt `
            --win-per-user-install `
            --description "Online radio za pab kviz - muzika izmedju rundi" `
            --copyright "Mihailo Jankovic" `
            --vendor "Mihailo Jankovic"

      # ZASTO release a ne artifact: artifact-i trose Actions storage kvotu, koja
      # se popuni posle dvadesetak build-ova i onda upload pada sa "Artifact
      # storage quota has been hit". Release asset ne ide u tu kvotu, ostaje
      # trajno i ima stalan link.
      - name: Objavi instaler kao Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.verzija }}"
          $tag = "v$v"
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "KvizRadio $v" `
              --notes "Instaler iz commita $env:GITHUB_SHA. Nosi libvlc $env:VLC_VERSION." `
              --target $env:GITHUB_SHA
          }
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          gh release upload $tag "$exe" --clobber
          Write-Host "Instaler: $(gh release view $tag --json url --jq .url)"
